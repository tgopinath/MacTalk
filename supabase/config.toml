# Minimal Supabase CLI config for MacTalk (used by `supabase link` / `supabase db push`).
project_id = "mactalk"

[auth]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600

[functions.invite-friend]
verify_jwt = true

[functions.turn-credentials]
verify_jwt = true
