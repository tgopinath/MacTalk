<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1440px;height:900px;overflow:hidden}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;background:radial-gradient(70% 80% at 12% 18%,#cfe0ff,transparent 60%),radial-gradient(60% 70% at 92% 95%,#7fa4f0,transparent 65%),linear-gradient(160deg,#e8f0ff,#a9c3f5 58%,#5f87dc);position:relative}
.mb{position:absolute;inset:0 0 auto 0;height:30px;background:rgba(255,255,255,.55);backdrop-filter:blur(20px);display:flex;align-items:center;padding:0 18px;font-size:13.5px;color:#1d1d1f;gap:22px}
.mb b{font-weight:700}.mb .r{margin-left:auto;display:flex;gap:18px;align-items:center}
.mb .ic{width:22px;height:22px;border-radius:5px;background:rgba(0,0,0,.12);display:grid;place-items:center}
.mb .ic img{width:18px;height:18px}
.pop{position:absolute;top:40px;right:96px;width:330px;height:470px;border-radius:12px;overflow:hidden;box-shadow:0 0 0 .5px rgba(0,0,0,.22),0 30px 70px -20px rgba(20,40,110,.55);background:#fff}
.pop img,.call img,.inc img{width:100%;height:100%;display:block}
.call{position:absolute;left:640px;top:300px;width:300px;height:380px;border-radius:13px;overflow:hidden;box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 36px 80px -24px rgba(10,25,80,.6)}
.inc{position:absolute;right:20px;bottom:20px;width:360px;height:104px;border-radius:18px;overflow:hidden;box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 24px 50px -18px rgba(10,25,80,.55)}
.hero{position:absolute;left:84px;top:190px;width:600px;color:#0f1d40}
.hero img{width:170px;height:170px;margin-left:-18px;filter:drop-shadow(0 20px 30px rgba(20,40,120,.25))}
.hero h1{font-size:54px;letter-spacing:-.02em;margin:6px 0 10px;font-weight:800}
.hero p{font-size:22px;line-height:1.45;margin:0 0 26px;color:#25355f;max-width:500px}
.keys{display:flex;gap:12px;flex-wrap:wrap}
.keys span{background:rgba(255,255,255,.72);border-radius:10px;padding:9px 14px;font-size:17px;color:#1d2c58;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.keys kbd{font:600 17px ui-monospace,SFMono-Regular,monospace;margin-right:6px}
</style></head><body>
<div class="mb"><b></b><b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span>
<div class="r"><span class="ic"><img src="icon.png" alt=""></span><span>Wi‑Fi</span><span>Wed 18 Nov&nbsp; 11:42 AM</span></div></div>
<div class="pop"><img src="popover-light.png" alt=""></div>
<div class="inc"><img src="incoming-light.png" alt=""></div>
<div class="hero"><img src="icon.png" alt=""><h1>MacTalk</h1><p>One-click voice calls to the friends you approve, straight from the Mac menu bar.</p>
<div class="keys"><span><kbd>⌃1–⌃9</kbd>speed dial</span><span>Accept or Decline</span><span>Peer-to-peer audio</span></div></div>
</body></html>
