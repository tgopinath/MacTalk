<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in to MacTalk</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; --blue:#2f6df6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141416; --card:#1f1f22; --text:#f5f5f7; --muted:#a1a1a6; --line:#3a3a3e; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; padding:16px; }
  main { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:32px 28px; text-align:center; }
  svg.mark { width:52px; height:52px; color:var(--blue); }
  h1 { font-size:22px; margin:14px 0 6px; }
  p { color:var(--muted); margin:0 0 22px; }
  button, a.btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:11px 14px; border-radius:10px;
         font:500 15px -apple-system, sans-serif; cursor:pointer; text-decoration:none; }
  button.google { background:#fff; color:#1f1f1f; border:1px solid #747775; }
  @media (prefers-color-scheme: dark) { button.google { background:#131314; color:#e3e3e3; border-color:#8e918f; } }
  button:disabled { opacity:.6; cursor:default; }
  a.btn { background:var(--blue); color:#fff; border:0; margin-top:12px; }
  .status { margin-top:16px; font-size:14px; color:var(--muted); min-height:1.5em; }
  .error { color:#d70015; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 1.5a1 1 0 0 1 1 1V5h6.5A2.5 2.5 0 0 1 18 7.5v12a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 6 19.5v-12A2.5 2.5 0 0 1 7 5.5V2.5a1 1 0 0 1 1-1Zm.75 6a.75.75 0 0 0-.75.75v4.5c0 .41.34.75.75.75h6.5c.41 0 .75-.34.75-.75v-4.5a.75.75 0 0 0-.75-.75h-6.5ZM10 17.25a.75.75 0 0 0 0 1.5h4a.75.75 0 0 0 0-1.5h-4Z"/></svg>
  <h1>Sign in to MacTalk</h1>
  <p id="lead">Continue with Google to finish signing in on your Mac.</p>
  <button class="google" id="google" type="button">
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Continue with Google
  </button>
  <a class="btn" id="return" hidden>Return to MacTalk</a>
  <div class="status" id="status" role="status" aria-live="polite"></div>
</main>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js'
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, setPersistence, inMemoryPersistence }
    from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js'

  // Public web config of the shared "gopinath-apps" Firebase project.
  const app = initializeApp({
    apiKey: 'AIzaSyAAfa2HyBS5G2Jduael4xCK-Dx2QNncWms',
    authDomain: 'gopinath-apps.firebaseapp.com',
    projectId: 'gopinath-apps',
    appId: '1:649205795156:web:4c862128a89af5e98ae0c1',
  })
  const auth = getAuth(app)
  await setPersistence(auth, inMemoryPersistence) // nothing stays signed in in this browser

  const params = new URLSearchParams(location.search)
  const state = params.get('state')
  const $ = (id) => document.getElementById(id)
  const status = (text, error) => { $('status').textContent = text; $('status').classList.toggle('error', !!error) }

  // Only hand a token to a MacTalk that started this sign-in (state is a one-time random value).
  if (!state || !/^[0-9A-Fa-f-]{36}$/.test(state)) {
    $('google').disabled = true
    $('lead').textContent = 'Open MacTalk on your Mac and choose Continue with Google there.'
  }

  function backToApp(query) {
    const url = `mactalk://auth?state=${encodeURIComponent(state)}&${query}`
    $('return').href = url
    $('return').hidden = false
    location.href = url
  }

  $('google').addEventListener('click', async () => {
    $('google').disabled = true
    status('Waiting for Google…')
    try {
      const provider = new GoogleAuthProvider()
      provider.setCustomParameters({ prompt: 'select_account' })
      const result = await signInWithPopup(auth, provider)
      const credential = GoogleAuthProvider.credentialFromResult(result)
      await signOut(auth)
      if (!credential?.idToken) throw new Error('Google did not return a sign-in token.')
      status('Signed in. Opening MacTalk… You can close this tab.')
      $('lead').textContent = `Signed in as ${result.user.email}.`
      $('google').hidden = true
      backToApp(`id_token=${encodeURIComponent(credential.idToken)}` +
                (credential.accessToken ? `&access_token=${encodeURIComponent(credential.accessToken)}` : ''))
    } catch (err) {
      $('google').disabled = false
      if (err?.code === 'auth/popup-closed-by-user' || err?.code === 'auth/cancelled-popup-request') {
        status('Sign-in was cancelled. Try again when you\'re ready.')
      } else if (err?.code === 'auth/popup-blocked') {
        status('Your browser blocked the Google window. Allow pop-ups for this page and try again.', true)
      } else {
        status(err?.message || 'Something went wrong. Try again.', true)
      }
    }
  })
</script>
</body>
</html>
